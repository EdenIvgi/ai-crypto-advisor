<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A bar chart where the network fee towers over the amount actually sent, captioned gas fees">
  <rect width="640" height="400" fill="#0e1220" />

  <text x="320" y="76" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="34" font-weight="700" letter-spacing="4">
    GAS FEES
  </text>

  <line x1="120" y1="318" x2="520" y2="318" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="2" text-anchor="middle">
    <rect x="176" y="292" width="104" height="26" rx="3" fill="#3ecf8e" />
    <text x="228" y="278" fill="#ffffff" font-size="21" font-weight="700">$12</text>
    <text x="228" y="344" fill="#ffffff" fill-opacity="0.55" font-size="15">SENT</text>

    <rect x="360" y="126" width="104" height="192" rx="3" fill="#e2585d" />
    <text x="412" y="112" fill="#ffffff" font-size="21" font-weight="700">$87</text>
    <text x="412" y="344" fill="#ffffff" fill-opacity="0.55" font-size="15">TO SEND IT</text>
  </g>

  <text x="320" y="378" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" letter-spacing="6">
    A TUESDAY, 9 AM
  </text>
</svg>
