<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A perfectly flat line running off the edge of the chart, captioned my exit strategy, hodl">
  <rect width="640" height="400" fill="#0e1220" />

  <text x="320" y="76" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="34" font-weight="700" letter-spacing="4">
    MY EXIT STRATEGY
  </text>

  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <line x1="48" y1="160" x2="592" y2="160" />
    <line x1="48" y1="230" x2="592" y2="230" />
    <line x1="48" y1="300" x2="592" y2="300" />
  </g>

  <!-- Runs off the right edge of the frame rather than stopping inside it. That is the joke. -->
  <line x1="48" y1="230" x2="640" y2="230" stroke="#7a8cf0" stroke-width="3" />
  <circle cx="48" cy="230" r="5.5" fill="#7a8cf0" />

  <text x="320" y="372" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" letter-spacing="6">
    HODL
  </text>
</svg>
