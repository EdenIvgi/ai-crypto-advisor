<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A donut chart that is almost entirely one asset, captioned diversified portfolio">
  <rect width="640" height="400" fill="#0e1220" />

  <text x="320" y="76" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="34" font-weight="700" letter-spacing="4">
    DIVERSIFIED
  </text>

  <g transform="rotate(-90 208 232)" fill="none" stroke-width="36">
    <circle cx="208" cy="232" r="82" stroke="#e2a545" stroke-dasharray="499.6 515.2" />
    <circle cx="208" cy="232" r="82" stroke="#7a8cf0" stroke-dasharray="10.3 515.2" stroke-dashoffset="-499.6" />
    <circle cx="208" cy="232" r="82" stroke="#3ecf8e" stroke-dasharray="5.2 515.2" stroke-dashoffset="-509.9" />
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" letter-spacing="2">
    <rect x="356" y="176" width="13" height="13" fill="#e2a545" />
    <text x="384" y="188" fill="#ffffff">BTC</text>
    <text x="576" y="188" fill="#ffffff" text-anchor="end">97%</text>

    <rect x="356" y="222" width="13" height="13" fill="#7a8cf0" />
    <text x="384" y="234" fill="#ffffff" fill-opacity="0.75">ETH</text>
    <text x="576" y="234" fill="#ffffff" fill-opacity="0.75" text-anchor="end">2%</text>

    <rect x="356" y="268" width="13" height="13" fill="#3ecf8e" />
    <text x="384" y="280" fill="#ffffff" fill-opacity="0.75">DOGE</text>
    <text x="576" y="280" fill="#ffffff" fill-opacity="0.75" text-anchor="end">1%</text>
  </g>

  <text x="320" y="372" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" letter-spacing="6">
    THREE WHOLE ASSETS
  </text>
</svg>
