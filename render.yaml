# Render blueprint for the API. The client is deployed separately on Vercel; see
# client/vercel.json and the deployment section of README.md.
#
# Create it with "New > Blueprint" in Render and point at this repository. The two variables
# marked `sync: false` are deliberately not in this file — one is a database password and the
# other is not known until Vercel has assigned the frontend its URL. Render prompts for both.

services:
  - type: web
    name: ai-crypto-advisor-api
    runtime: node
    plan: free
    # Pick whichever region is closest to the MongoDB Atlas cluster. Every request makes
    # several round trips to the database and only one to the browser, so the distance that
    # matters is this one.
    region: frankfurt
    branch: main

    # Installed from the workspace root rather than from server/, because this is an npm
    # workspaces monorepo and the lockfile lives at the top. `npm ci` there is what gives a
    # reproducible install.
    buildCommand: npm ci
    startCommand: npm start --workspace server

    # Render restarts the instance if this stops answering. It is also the cheapest way to
    # see from the outside whether the process is alive at all.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render generates this once and keeps it. Nothing has to type a secret anywhere, and
      # the local development secret never becomes the production one.
      - key: JWT_SECRET
        generateValue: true

      # Entered in the Render dashboard: the Atlas connection string, database name included.
      - key: MONGODB_URI
        sync: false

      # The exact origin Vercel gives the frontend. This is the CORS allow-list and it has to
      # match the browser's Origin header character for character.
      - key: CLIENT_ORIGIN
        sync: false
